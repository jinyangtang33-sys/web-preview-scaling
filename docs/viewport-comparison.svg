<svg xmlns="http://www.w3.org/2000/svg" width="960" height="338" viewBox="0 0 960 338" role="img" aria-labelledby="title desc">
  <title id="title">同一视口下的正文宽度对照</title>
  <desc id="desc">示例修复前，视口为 1280 × 720 CSS 像素。侧边预览的可用宽度为 1265 像素，正文宽 1225 像素，滚动条占 15 像素。独立无头 Chrome 的可用宽度为 1280 像素，正文宽 1240 像素。两边标题字号均为 89.6 像素。</desc>
  <defs>
    <pattern id="scrollbar" width="5" height="5" patternUnits="userSpaceOnUse">
      <rect width="5" height="5" fill="#f1c6a2"/>
      <path d="M-1 1l2-2M0 5l5-5m-1 6 2-2" stroke="#964d2f" stroke-width="1.5"/>
    </pattern>
  </defs>
  <g font-family="system-ui, 'Microsoft YaHei', sans-serif" fill="#1b3934">
    <rect width="960" height="338" rx="12" fill="#f7f5ed"/>
    <text x="40" y="36" font-size="16" fill="#51685d">岸线手记　/　示例实测</text>
    <text x="920" y="36" text-anchor="end" font-size="16">视口 1280 × 720 CSS px</text>
    <text x="40" y="84" font-size="32" font-weight="700">同一页，正文宽度相差 15 px</text>
    <line x1="40" y1="101" x2="920" y2="101" stroke="#bcc9bd"/>

    <text x="40" y="136" font-size="20" font-weight="600">Codex 侧边预览</text>
    <text x="905" y="136" text-anchor="end" font-size="17" fill="#823c23">滚动条占 15 px</text>
    <path d="M910 131h5v16" fill="none" stroke="#964d2f" stroke-width="1.5"/>
    <!-- Each 1280 CSS px viewport is drawn at the same scale: 880/1280. -->
    <g transform="translate(40 150) scale(.6875 1)">
      <rect width="1280" height="34" fill="#d5dbce"/>
      <rect x="20" width="1225" height="34" fill="#215f53"/>
      <rect x="1265" width="15" height="34" fill="url(#scrollbar)"/>
    </g>
    <text x="66" y="173" fill="white" font-size="17">正文 1225 px</text>

    <text x="40" y="222" font-size="20" font-weight="600">独立无头 Chrome</text>
    <text x="920" y="222" text-anchor="end" font-size="17" fill="#51685d">滚动条占 0 px</text>
    <g transform="translate(40 236) scale(.6875 1)">
      <rect width="1280" height="34" fill="#d5dbce"/>
      <rect x="20" width="1240" height="34" fill="#215f53"/>
    </g>
    <text x="66" y="259" fill="white" font-size="17">正文 1240 px</text>
    <line x1="40" y1="289" x2="920" y2="289" stroke="#bcc9bd"/>
    <text x="40" y="317" font-size="18">两端标题均为 <tspan font-weight="700">89.6 px</tspan></text>
    <rect x="735" y="303" width="16" height="16" fill="#d5dbce"/>
    <text x="761" y="317" font-size="16" fill="#51685d">两侧各留 20 px</text>
  </g>
</svg>
