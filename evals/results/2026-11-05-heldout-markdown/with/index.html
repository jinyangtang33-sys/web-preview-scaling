<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Markdown Editor</title>
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="lib/material-icons.css">
    <link rel="stylesheet" href="lib/base16-light.css">
    <link rel="stylesheet" href="codemirror/lib/codemirror.css">
    <link rel="stylesheet" href="lib/default.css">
    <link rel="stylesheet" href="lib/github-markdown.css">
    <link rel="stylesheet" href="lib/spell-checker.min.css">
    <link rel="stylesheet" href="lib/sweetalert.css">
    <link rel="stylesheet" href="index.css">
  </head>
  <body id="toplevel">
    <main class="workspace">
      <section class="source-pane" aria-label="Markdown source"><header class="pane-label">Markdown source</header><div id="in"><form><textarea id="code"># New Document</textarea></form></div></section>
      <section class="preview-pane" aria-label="Live preview"><header class="pane-label">Live preview</header><div id="out" class="markdown-body" tabindex="-1" role="region" aria-label="Rendered document"></div></section>
    </main>
    <dialog id="menu" aria-label="Save As">
      <span>Save As</span>
      <button id="saveas-markdown">
        <svg height="64" width="64" xmlns="http://www.w3.org/2000/svg">
          <g transform="scale(0.0625)">
            <path d="M950.154 192H73.846C33.127 192 0 225.12699999999995 0 265.846v492.308C0 798.875 33.127 832 73.846 832h876.308c40.721 0 73.846-33.125 73.846-73.846V265.846C1024 225.12699999999995 990.875 192 950.154 192zM576 703.875L448 704V512l-96 123.077L256 512v192H128V320h128l96 128 96-128 128-0.125V703.875zM767.091 735.875L608 512h96V320h128v192h96L767.091 735.875z" />
          </g>
        </svg>
        <span>Markdown</span>
      </button>
      <button id="saveas-html">
        <svg height="64" width="64" xmlns="http://www.w3.org/2000/svg">
          <g transform="scale(0.0625) translate(64,0)">
            <path d="M608 192l-96 96 224 224L512 736l96 96 288-320L608 192zM288 192L0 512l288 320 96-96L160 512l224-224L288 192z" />
          </g>
        </svg>
        <span>HTML</span>
      </button>
      <button id="close-menu" aria-label="Close download options">&times;</button>
    </dialog>
    <div id="navbar">
      <div id="navcontent">
        <a id="logo" href = "https://github.com/jbt/markdown-editor" tooltip = "Check out the code on Github!">
          <p id="title" class="left"># Markdown Editor</p>
        </a>
        <button id="openbutton" title="Open from Disk" class="navbutton left" onclick="document.getElementById('fileInput').click()"><i aria-hidden="true" class="material-icons">open_in_browser</i>Open</button>
        <input id="fileInput" type="file" class="hidden" accept=".md,.mdown,.txt,.markdown"/>
        <button id="savebutton" title="Download" class="navbutton left" onclick="showMenu()"><i aria-hidden="true" class="material-icons">file_download</i>Download</button>
        <button id="browsersavebutton" title="Browser Save (Experimental)" class="navbutton left" onclick="saveInBrowser()"><i aria-hidden="true" class="material-icons">save</i>Save</button>
        <button id="sharebutton" title="Generate Shareable Link" class="navbutton left" onclick="updateHash()"><i aria-hidden="true" class="material-icons">share</i>Share</button>
        <button id="nightbutton" title="Night Mode" aria-pressed="false" class="navbutton left" onclick="toggleNightMode(this)"><i aria-hidden="true" class="material-icons">invert_colors</i>Night</button>
        <button id="spellbutton" title="Spell Check" aria-pressed="true" class="navbutton left selected" onclick="toggleSpellCheck(this)"><i aria-hidden="true" class="material-icons">spellcheck</i>Spelling</button>
        <button id="readbutton" title="Reading Mode" aria-pressed="false" class="navbutton left" onclick="toggleReadMode(this)"><i aria-hidden="true" class="material-icons">chrome_reader_mode</i><span>Read preview</span></button>
        <p id="newbutton" class="navbutton left hidden" onclick="clearEditor()">Clear</p>
        <p id="sharebutton" class="navbutton left selected hidden">Share</p>
      </div>
    </div>
    <script src="lib/markdown-it.js"></script>
    <script src="lib/markdown-it-footnote.js"></script>
    <script src="lib/highlight.pack.js"></script>
    <script src="lib/emojify.js"></script>
    <script src="codemirror/lib/codemirror.js"></script>
    <script src="codemirror/overlay.js"></script>
    <script src="codemirror/xml/xml.js"></script>
    <script src="codemirror/markdown/markdown.js"></script>
    <script src="codemirror/gfm/gfm.js"></script>
    <script src="codemirror/javascript/javascript.js"></script>
    <script src="codemirror/css/css.js"></script>
    <script src="codemirror/htmlmixed/htmlmixed.js"></script>
    <script src="codemirror/lib/util/continuelist.js"></script>
    <script src="lib/spell-checker.min.js"></script>
    <script src="lib/rawinflate.js"></script>
    <script src="lib/rawdeflate.js"></script>
    <script src = "lib/sweetalert.min.js"></script>
    <script src="index.js"></script>
  </body>
</html>
