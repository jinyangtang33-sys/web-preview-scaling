<!doctype html><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>未见项目 · 同预算网页对照</title><style>*{box-sizing:border-box}body{font:16px/1.5 system-ui;background:#f4f4f1;color:#17201c;padding:20px;margin:0}h1{font-size:28px}select{font:inherit;padding:8px;max-width:100%}.pair{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:20px}figure{margin:0}img{max-width:100%;display:block;border:1px solid #aaa}figcaption{font-weight:700;margin-bottom:8px}@media(max-width:640px){.pair{grid-template-columns:1fr}}</style>
<h1>Markdown Editor · 同预算网页对照</h1><p>两边各三次代码回复、十五分钟上限；源自同一公开项目和数据。点图片查看完整尺寸。</p><label>页面状态 <select></select></label><div class="pair"></div>
<script>const items=[{"label": "1440 \u00d7 900 \u00b7 initial", "file": "1440-initial.png"}, {"label": "1440 \u00d7 900 \u00b7 document", "file": "1440-document.png"}, {"label": "1440 \u00d7 900 \u00b7 reading", "file": "1440-reading.png"}, {"label": "1440 \u00d7 900 \u00b7 night", "file": "1440-night.png"}, {"label": "1440 \u00d7 900 \u00b7 download", "file": "1440-download.png"}, {"label": "390 \u00d7 844 \u00b7 initial", "file": "390-initial.png"}, {"label": "390 \u00d7 844 \u00b7 document", "file": "390-document.png"}, {"label": "390 \u00d7 844 \u00b7 reading", "file": "390-reading.png"}, {"label": "390 \u00d7 844 \u00b7 night", "file": "390-night.png"}, {"label": "390 \u00d7 844 \u00b7 download", "file": "390-download.png"}];const select=document.querySelector('select'),pair=document.querySelector('.pair');items.forEach((x,i)=>select.add(new Option(x.label,i)));function show(){pair.replaceChildren();['without','with'].forEach((arm,i)=>{const f=document.createElement('figure'),c=document.createElement('figcaption'),a=document.createElement('a'),im=new Image();c.textContent=i?'有 skill':'无 skill';im.src=arm+'/screenshots/'+items[select.selectedIndex].file;a.href=im.src;a.append(im);f.append(c,a);pair.append(f)})}select.onchange=show;select.value=items.findIndex(x=>x.label==='390 × 844 · document');show()</script>
