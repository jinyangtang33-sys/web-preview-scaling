name: Browser diagnostics and archive checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  layout:
    name: Browser diagnostics and archived evidence
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Install Playwright Core
        run: npm install --no-save --no-package-lock --ignore-scripts playwright-core@1.62.1
      - name: Run base checks in Chrome
        env:
          PLAYWRIGHT_CHANNEL: chrome
        run: node --test tests/*.test.cjs
      - name: Verify published holdout proposals and budget ledger
        run: python3 evals/results/2026-11-05-heldout-todomvc/verify-proposals.py
      - name: Verify slim candidate holdout proposals and vendors
        run: python3 evals/results/2026-11-05-heldout-markdown/verify-proposals.py
